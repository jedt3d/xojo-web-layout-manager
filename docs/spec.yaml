name: FlexLayoutManager
description: A layout manager class that implements a subset of CSS Flexbox for UI controls.
target_platform: Xojo Web (ported from Xojo Desktop)
version: 2.0.0

enums:
  FlexDirection:
    description: "Defines the main axis for laying out items."
    values:
      - name: Row
        value: 0
        description: "Items are laid out horizontally from left to right."
      - name: Column
        value: 1
        description: "Items are laid out vertically from top to bottom."
        
  JustifyContent:
    description: "Defines how the browser distributes space between and around content items along the main axis."
    values:
      - name: FlexStart
        value: 0
        description: "Items are packed toward the start of the flex-direction."
      - name: FlexEnd
        value: 1
        description: "Items are packed toward the end of the flex-direction."
      - name: Center
        value: 2
        description: "Items are centered along the line."
      - name: SpaceBetween
        value: 3
        description: "Items are evenly distributed in the line; first item is on the start line, last item on the end line."
      - name: SpaceAround
        value: 4
        description: "Items are evenly distributed in the line with equal space around them."
      - name: Stretch
        value: 5
        description: "Items are stretched to fit the container along the main axis evenly (when FlexGrow is not applied). Implemented as flex factor 1 on every item."
      - name: SpaceEvenly
        value: 6
        description: "Equal space before, between and after the items (added in 1.2.0; value appended so saved Inspector values keep their meaning)."
        
  AlignItems:
    description: "Defines the default behavior for how flex items are laid out along the cross axis on the current line."
    values:
      - name: FlexStart
        value: 0
        description: "Items are placed at the start of the cross axis."
      - name: FlexEnd
        value: 1
        description: "Items are placed at the end of the cross axis."
      - name: Center
        value: 2
        description: "Items are centered in the cross axis."
      - name: Stretch
        value: 3
        description: "Items are stretched to fill the container along the cross axis."

properties:
  public:
    - name: Direction
      type: FlexDirection
      default: Row
    - name: MainAxisAlignment
      type: JustifyContent
      default: FlexStart
    - name: CrossAxisAlignment
      type: AlignItems
      default: FlexStart
    - name: Gap
      type: Integer
      default: 0
      description: "Spacing between items."
    - name: PaddingLeft
      type: Integer
      default: 0
    - name: PaddingTop
      type: Integer
      default: 0
    - name: PaddingRight
      type: Integer
      default: 0
    - name: PaddingBottom
      type: Integer
      default: 0
  protected:
    - name: ManagedControls
      type: Array of WebUIControl (or equivalent base control class)
      description: "List of controls added to this layout manager."
    - name: FlexGrowMap
      type: Dictionary
      description: "Maps a control reference to its flex-grow factor (Double)."

methods:
  - name: AddControl
    parameters:
      - name: c
        type: WebUIControl
      - name: growFactor
        type: Double
        default: 0
    description: "Adds a control to the layout manager and assigns its flex-grow factor."
    
  - name: SetFlexGrow
    parameters:
      - name: c
        type: WebUIControl
      - name: growFactor
        type: Double
    description: "Updates the flex-grow factor for an already added control."

  - name: ApplyLayout
    description: "Calculates positions and sizes for all visible managed controls and applies them."

layout_algorithm:
  engine: "Since 1.2.0 all arithmetic is done by DSFlexEngine.Arrange (DSCore/DSFlexEngine.xojo_code), the layout engine of the Clinic DS spec §8.5, shared with DesktopFlexLayoutManager. ApplyLayout only maps settings and applies results."
  mapping:
    - "Visible managed controls, in AddControl order, become DSFlexItem objects; IntrinsicMain / IntrinsicCross = the basis sizes stored by AddControl (BasisWidthMap / BasisHeightMap), so earlier passes never change a control's natural size."
    - "Grow factor g (Double) -> engine factor Max(1, Floor(g x 1000 + 0.5)); only the ratios matter, so fractional factors keep their meaning."
    - "MainAxisAlignment FlexStart/FlexEnd/Center/SpaceBetween/SpaceAround/SpaceEvenly -> MainAxisAlignment Start/End_/Center/SpaceBetween/SpaceAround/SpaceEvenly. MainAxisAlignment Stretch -> Start with factor 1 on every item when no control grows."
    - "CrossAxisAlignment FlexStart/FlexEnd/Center/Stretch -> CrossAxisAlignment Start/End_/Center/Stretch."
    - "Results are local to the WebRectangle and assigned as they are, only when a value changed (each change is a browser update)."
  behaviour_changes_from_1_1_0:
    - "Edges are rounded with Floor(x + 0.5) instead of Round (whose tie rule depends on the server OS), so adjacent items never leave 1 px gaps."
    - "When content is larger than the container, alignment uses zero free space: items start at the padding instead of moving to negative positions (FlexEnd), and SpaceBetween / SpaceAround keep Gap. Debug builds log the overflow."
    - "With free space, SpaceBetween and SpaceAround give the same positions as before (Gap + free / (n - 1) equals the old (available - fixed) / (n - 1))."
    - "The cross axis uses the basis size too: after CrossAxisAlignment Stretch is switched off, controls return to their natural size."
    - "In CrossAxisAlignment FlexStart/FlexEnd/Center a control bigger than the content area on the cross axis is reduced to the content size."
